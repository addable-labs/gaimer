<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Gaimer</title>

        <!-- CONFIGURATION FOR MOBILE SCREENS -->
        <!-- Adopted from: https://gist.github.com/hal0gen/5852bd9db240c477f20c -->

        <!-- Allow web app to be run in full-screen mode - iOS. -->
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <!-- Allow web app to be run in full-screen mode - Android. -->
        <meta name="mobile-web-app-capable" content="yes" />

        <!-- Configure the status bar - iOS. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />

        <!-- Set the viewport. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />

        <!-- Disable automatic phone number detection. -->
        <meta name="format-detection" content="telephone=no" />

        <!-- Styles go in src/styles.css, not in a style element here: in the
             built app Tauri would give that element a nonce, and the game
             page's own style would then no longer apply. -->
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
