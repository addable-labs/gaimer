name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.platform == 'ubuntu-latest' && 'rustfmt, clippy' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Check Rust formatting
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run clippy
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo test

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }}

  build-ios:
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Initialize iOS project
        run: yarn tauri ios init

      # The app icon set is kept in git (see src-tauri/.gitignore): init must
      # leave it as it is, and the App Store refuses icons with an alpha channel
      - name: Check the iOS app icons
        run: |
          icons=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          changed=$(git status --porcelain --ignored -- "$icons")
          if [ -n "$changed" ]; then echo "tauri ios init changed the icon set:"; echo "$changed"; exit 1; fi
          for f in "$icons"/*.png; do
            sips -g hasAlpha "$f" | grep -q 'hasAlpha: no' || { echo "$f has an alpha channel"; exit 1; }
          done
          echo "$(ls "$icons"/*.png | wc -l) icons, none with an alpha channel"

      - name: Build iOS (simulator)
        run: yarn tauri ios build --target aarch64-sim

      # From src-tauri/Info.ios.plist: the status bar's text is then white,
      # over the app's dark header, whether the phone is set to light or dark
      - name: Check that the iOS app is always dark
        run: |
          style=$(plutil -extract UIUserInterfaceStyle raw -o - src-tauri/gen/apple/build/arm64-sim/gaimer.app/Info.plist)
          echo "UIUserInterfaceStyle: $style"
          test "$style" = Dark
